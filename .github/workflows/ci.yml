name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-workflows:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.11"
          - os: windows-latest
            python: "3.11"
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and boundary tests
        run: python -m unittest discover -s tests -v
      - name: Check documentation links
        run: python tools/check_docs.py
      - name: Audit publication candidates
        run: python tools/audit_public.py
      - name: Run standalone offline demo
        run: python run.py demo --output out/ci-demo
      - name: Install and verify console entry
        run: |
          python -m pip install . --no-deps
          hunting-workflow --version
